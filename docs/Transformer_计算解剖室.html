 mm('Logits','Hfinal','W_vocab');

 $('#step-footer').innerHTML=`<button class="btn" data-step="${Math.max(0,state.step-1)}"${state.step===0?' disabled':''}>← 上一步</button><span class="hint">可用键盘 ← → 切换步骤 · 点击矩阵数字展开推导</span><button class="btn primary" data-step="${state.step===13?0:state.step+1}">${state.step===13?'回到全局链路 ↺':steps[state.step+1][0]+' →'}</button>`;
 renderInspector();
}
function go(step){state.step=Math.max(0,Math.min(13,step));visited.add(state.step);calculate();defaultSelection();render();$('#sidebar').classList.remove('open');window.scrollTo({top:0,behavior:'instant'});}
function inspect(id,i,j){state.sel={id,i,j};renderInspector();if(window.innerWidth<=1000)$('#inspector').scrollIntoView({behavior:'smooth',block:'start'})}
function toast(text){const el=$('#toast');el.textContent=text;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3300)}
function train(n){if(!state.causal)return;if(!state.history.length)state.history.push(model.loss);for(let k=0;k<n;k++){const m=E.forward(state),old=E.clone(state.weights.W_vocab),grad=m.t.GradHead.data;state.weights.W_vocab=old.map((r,i)=>r.map((v,j)=>v-.2*grad[i][j]));const newer=E.forward(state);state.lastUpdate={old,grad,before:m.loss,after:newer.loss};state.history.push(newer.loss);state.trainSteps++}calculate();defaultSelection();render();toast(`已完成 ${n} 步输出头 SGD；主干权重保持不变。`)}
function download(name,content,type='text/plain;charset=utf-8'){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function config(){return {ids:state.ids,heads:state.heads,alpha:state.alpha,causal:state.causal,scaled:state.scaled,tau:state.tau,target:state.target,weights:state.weights}}
function pythonSource(){return `# Transformer Lab — reproducible snapshot of the current browser model.
# Python 3 + PyTorch. No pretrained models, no external data.
# Matrix convention: W is [in_features, out_features], so use x @ W directly.
# All parameters require gradients here; the webpage's training button updates
# ONLY W_vocab. This script demonstrates a full backward pass without updating.
import json
import math
from pathlib import Path
try:
    import torch
    import torch.nn.functional as F
except ImportError as exc:
    raise SystemExit("Please install PyTorch: python -m pip install torch") from exc

CONFIG = json.loads(r'''${JSON.stringify(config())}''')
torch.set_default_dtype(torch.float64)
w = {k: torch.tensor(v, dtype=torch.float64, requires_grad=True) for k, v in CONFIG["weights"].items()}
ids = torch.tensor(CONFIG["ids"], dtype=torch.long)
T, D, HEADS = len(ids), 4, CONFIG["heads"]
DH = D // HEADS
trace = dict(w)
def put(name, value):
    trace[name] = value
    return value

def ln(name, x, gamma, beta):
    return put(name, F.layer_norm(x, (D,), w[gamma][0], w[beta][0], eps=1e-5))

emb = put("Emb", w["E"][ids])
p = torch.arange(T, dtype=torch.float64)
pos = put("P", torch.stack([p.sin(), p.cos(), (p/100).sin(), (p/100).cos()], dim=1))
pos_scaled = put("Pscaled", CONFIG["alpha"] * pos)
x = put("X", emb + pos_scaled)
n1 = ln("N1", x, "gamma1", "beta1")
q, k, v = [put(name, n1 @ w["W" + name]) for name in ("Q", "K", "V")]
head_outputs = []
for h in range(HEADS):
    qh = put("Q" + str(h), q[:, h*DH:(h+1)*DH])
    kh = put("K" + str(h), k[:, h*DH:(h+1)*DH])
    vh = put("V" + str(h), v[:, h*DH:(h+1)*DH])
    raw = put("Sraw" + str(h), qh @ kh.T)
    scores = put("S" + str(h), raw / math.sqrt(DH) if CONFIG["scaled"] else raw)
    if CONFIG["causal"]:
        future = torch.triu(torch.ones(T, T, dtype=torch.bool), diagonal=1)
        scores = scores.masked_fill(future, float("-inf"))
    masked = put("M" + str(h), scores)
    attn_weights = put("A" + str(h), F.softmax(masked, dim=-1))
    head_outputs.append(put("Head" + str(h), attn_weights @ vh))
joined = put("Concat", torch.cat(head_outputs, dim=-1))
a = put("Attn", joined @ w["WO"])
x1 = put("R1", x + a)
n2 = ln("N2", x1, "gamma2", "beta2")
u_linear = put("Ulinear", n2 @ w["W1"])
u = put("U", u_linear + w["bMLP1"])
g = put("G", F.gelu(u, approximate="tanh"))
f_linear = put("Flinear", g @ w["W2"])
ff = put("FF", f_linear + w["bMLP2"])
x2 = put("R2", x1 + ff)
h_final = ln("Hfinal", x2, "gammaF", "betaF")
logits = put("Logits", h_final @ w["W_vocab"])
l_tau = put("Ltau", logits / CONFIG["tau"])
probs = put("Prob", F.softmax(l_tau, dim=-1))
p_train = put("P_train", F.softmax(logits, dim=-1))
targets = torch.tensor(CONFIG["ids"][1:] + [CONFIG["target"]], dtype=torch.long)
losses = F.cross_entropy(logits, targets, reduction="none")
put("Loss", losses[:, None])
loss = losses.mean()
grad_logits = put("GradLogits", (p_train - F.one_hot(targets, 8)) / T)
grad_head = put("GradHead", h_final.T @ grad_logits)
loss.backward()

print("Shape of logits:", tuple(logits.shape), "(batch dimension 1 omitted)")
print("Last-position probabilities:", probs[-1].detach().tolist())
print("Mean cross-entropy:", loss.item())
print("\\nFull backward: parameter gradient norms")
for name, param in w.items():
    print(f"{name:12s} shape={str(tuple(param.shape)):10s} grad_norm={param.grad.norm().item():.10f}")
assert torch.allclose(w["W_vocab"].grad, grad_head, atol=1e-12, rtol=1e-10)
print("Output-head analytical gradient matches PyTorch autograd.")
if not CONFIG["causal"]:
    print("WARNING: causal mask is disabled; this is not valid autoregressive training.")

def json_safe(value):
    if isinstance(value, list):
        return [json_safe(x) for x in value]
    if isinstance(value, float) and not math.isfinite(value):
        return "-Infinity" if value < 0 else "Infinity" if value > 0 else "NaN"
    return value
payload = {"loss": loss.item(), "tensors": {k: json_safe(v.detach().tolist()) for k,v in trace.items()}}
Path("forward_trace_torch.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2, allow_nan=False), encoding="utf-8")
print("Saved all intermediate tensors to forward_trace_torch.json")
`}
function bind(){
 document.addEventListener('click',ev=>{
  const btn=ev.target.closest('button');if(!btn||btn.disabled)return;
  if(btn.dataset.step!==undefined){go(Number(btn.dataset.step));return;}
  if(btn.dataset.inspect){const [id,i,j]=btn.dataset.inspect.split(',');inspect(id,Number(i),Number(j));return;}
  if(btn.dataset.row!==undefined){state.row=Number(btn.dataset.row);calculate();defaultSelection();render();return;}
  if(btn.dataset.head!==undefined){state.head=Number(btn.dataset.head);calculate();defaultSelection();render();return;}
  if(btn.hasAttribute('data-menu')){$('#sidebar').classList.toggle('open');return;}
  if(btn.hasAttribute('data-add-token')){if(state.ids.length<6){state.ids.push(3);state.row=state.ids.length-1;resetLearningHistory();calculate();defaultSelection();render()}return;}
  if(btn.hasAttribute('data-remove-token')){if(state.ids.length>1){state.ids.pop();state.row=Math.min(state.row,state.ids.length-1);resetLearningHistory();calculate();defaultSelection();render()}return;}
  if(btn.hasAttribute('data-precision')){state.precision=state.precision===3?5:3;render();return;}
  if(btn.hasAttribute('data-reset')){const step=state.step;Object.assign(state,{ids:[0,1,2],row:2,heads:1,head:0,alpha:1,causal:true,scaled:true,tau:1,target:6,weights:E.clone(E.defaults),history:[],trainSteps:0,lastUpdate:null});go(step);toast('已恢复初始输入、全部参数与实验开关。');return;}
  if(btn.dataset.resetParam){const [id,i,j]=btn.dataset.resetParam.split(',');state.weights[id][+i][+j]=E.defaults[id][+i][+j];resetLearningHistory();render();return;}
  if(btn.dataset.generate){if(state.ids.length>=6)return;const p=tensor('Prob').at(-1);let idx=p.indexOf(Math.max(...p));if(btn.dataset.generate==='sample'){let u=Math.random();idx=p.length-1;for(let j=0;j<p.length;j++){u-=p[j];if(u<=0){idx=j;break}}}state.ids.push(idx);state.row=state.ids.length-1;resetLearningHistory();calculate();defaultSelection();render();toast(`已将“${V[idx]}”接到输入末尾，并重新计算完整前缀。${idx===7?'本次得到结束标记。':''}`);return;}
  if(btn.dataset.train){train(Number(btn.dataset.train));return;}
  if(btn.hasAttribute('data-reset-head')){state.weights.W_vocab=E.clone(E.defaults.W_vocab);resetLearningHistory();render();toast('仅输出头已重置，其他参数与输入保持不变。');return;}
  if(btn.dataset.export==='python'){download('transformer_snapshot.py',pythonSource());toast('已导出当前配置的 PyTorch 复现脚本。');return;}
  if(btn.dataset.export==='json'){download('transformer_trace.json',JSON.stringify({config:config(),loss:model.loss,tensors:Object.fromEntries(Object.entries(model.t).map(([k,v])=>[k,v.data]))},(_,v)=>v===-Infinity?'-Infinity':v,2),'application/json;charset=utf-8');toast('已导出参数、输入与所有中间矩阵。');return;}
 });
 document.addEventListener('change',ev=>{
  const el=ev.target;if(el.dataset.token!==undefined){state.ids[Number(el.dataset.token)]=Number(el.value);resetLearningHistory();calculate();defaultSelection();render();return;}
  if(el.dataset.key){const k=el.dataset.key;state[k]=Number(el.value);if(k==='heads'||k==='target')resetLearningHistory();calculate();defaultSelection();render();return;}
  if(el.dataset.check){state[el.dataset.check]=el.checked;resetLearningHistory();calculate();defaultSelection();render();return;}
  if(el.dataset.range){state[el.dataset.range]=Number(el.value);if(el.dataset.range!=='tau')resetLearningHistory();calculate();render();return;}
  if(el.dataset.param){const [id,i,j]=el.dataset.param.split(',');let x=Number(el.value);if(!Number.isFinite(x)||el.value===''){toast('请输入一个有效的有限数值。');renderInspector();return;}x=Math.min(10,Math.max(-10,x));state.weights[id][+i][+j]=x;resetLearningHistory();render();toast(`${id}[${i},${j}] 已更新，所有下游结果已重算。`);return;}
 });
 document.addEventListener('input',ev=>{
  const el=ev.target;if(!el.dataset.range)return;
  state[el.dataset.range]=Number(el.value);
  const out=document.querySelector(`[data-output="${el.dataset.range}"]`);
  if(out)out.textContent=Number(el.value).toFixed(2);
  calculate();
  // Preserve the active slider DOM node while updating every displayed value.
  const limits={};
  document.querySelectorAll('.cell[data-inspect]').forEach(cell=>{
    const [id,ri,ci]=cell.dataset.inspect.split(','),v=tensor(id)[+ri][+ci];
    if(limits[id]===undefined)limits[id]=Math.max(...tensor(id).flat().filter(Number.isFinite).map(Math.abs),.01);
    cell.textContent=fmt(v);cell.style.cssText=heat(v,limits[id],/^(A\d|Prob|P_train)$/.test(id));
    cell.setAttribute('aria-label',`展开 ${xy(id,+ri,+ci)} 的计算，数值 ${fmt(v)}`);
  });
  const p=tensor('Prob')[state.row];
  document.querySelectorAll('.prob-row').forEach((row,j)=>{row.querySelector('.bar-fill').style.width=`${100*p[j]}%`;row.querySelector('.prob-number').textContent=pct(p[j]);});
  renderInspector();
 });
 document.addEventListener('keydown',ev=>{if(['INPUT','SELECT','TEXTAREA'].includes(ev.target.tagName)||ev.altKey||ev.metaKey||ev.ctrlKey)return;if(ev.key==='ArrowRight'&&state.step<13){ev.preventDefault();go(state.step+1)}if(ev.key==='ArrowLeft'&&state.step>0){ev.preventDefault();go(state.step-1)}if(ev.key==='Escape')$('#sidebar').classList.remove('open')});
}
calculate();bind();render();
window.TransformerLab={state,get model(){return model},go,render,inspect,train,pythonSource,config};
})();

</script>
</body></html>
