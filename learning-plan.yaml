schema_version: 1
title: "第一阶段：PyTorch 与模型所需的数学基本功"
language: "zh-CN"
scope:
  goal: "独立完成分类模型的训练与评估，并解释 shape、梯度、损失、参数更新与训练内存。"
  suggested_duration_days: "5～7"
  suggested_daily_minutes: "120～180"
  pacing: "按掌握程度推进，不以天数代替通关标准。"
  prerequisites:
    - "能阅读基本 Python：变量、列表、索引、函数、循环和类。"
    - "能运行 Python 脚本；环境未就绪时先完成手算任务。"
  deferred_topics:
    - "系统重学高等数学、完整线性代数证明"
    - "完整 Transformer、分布式训练、混合精度的深入实现"
    - "复杂模型调参和追求榜单成绩"

teaching_protocol:
  cycle:
    - "教师讲解一个必要概念，并给出一个小例子。"
    - "分配 1～3 个手算或实现任务，运行前先预测结果。"
    - "学生提交答案、代码、输出或具体卡点。"
    - "教师核对答案，指出原因并给一个针对性的纠错练习。"
    - "达到当前验收标准后再进入下一任务。"
  hint_ladder:
    - "一级：提示需要观察的轴、变量或关系，不直接给答案。"
    - "二级：拆分问题，提供中间步骤或代码骨架。"
    - "三级：演示一个相似例题，再让学生独立完成原题。"
    - "仍有困难或学生明确要求时给出解答，并安排迁移练习。"
  rules:
    - "每次只发布当前小步任务，不一次要求完成整个阶段。"
    - "以学生提交的证据判断掌握情况，不能因为讲解过就标记完成。"
    - "优先动手、预测和解释，数学只补当前任务需要的部分。"
    - "后续教学以此文件为学习范围和任务依据。"
    - "任务验收后更新任务状态与 progress；保留必要的错题记录。"
    - "学生要求加快或跳过巩固题时继续推进，未确认的薄弱点放到后续综合练习复查，不重复卡关。"
  submission: ["手算答案", "代码或文件路径", "关键输出", "自己的解释或卡点"]

tracking:
  allowed_statuses: ["not_started", "in_progress", "needs_review", "completed"]
  completion_rule: "学生提交结果且教师核对通过后，才能标记 completed。"

progress:
  current_stage: "s03"
  current_task: "s03_t01"
  last_verified_task: "s02_t04"
  note: "2026-09-24：第二阶段核心综合实现通过本地 PyTorch 运行核对，按学生要求在第二阶段结束处暂停教学；下一任务为梯度手算，尚未开始。s01_t03 和 s02_t01 的独立基础练习保留为后续复查，不阻止推进。"
  review_log:
    - task: "s01_t01"
      observation: "轴数、元素数与逐层索引理解正确；[5, 6] 的行列说反，已纠正；标量与向量的精确 shape 已补充讲解。"
      follow_up: "后续综合练习顺带复查行列顺序和 []、[1]、[N] 的区别。"
    - task: "s02_t01"
      observation: "最初误认为 [2,3]@[2,3] 可计算，已讲解共享维度匹配；后续正确判断 [2,3,4]@[3,5] 不可计算。学生选择暂跳具体数值手算。"
      follow_up: "在小尺寸 PyTorch 实验中核对点积数值。"
    - task: "s02_t02"
      observation: "正确给出 [32,128,11008]；最初误解每个 token 独有权重，纠正后正确回答参数数量与共享关系。"
      follow_up: "学生随后报告已完成修正后的 x@w+b 练习。"
    - task: "s02_t03"
      observation: "已提交正确的 reshape/transpose 对照数值及拆头、交换轴、还原代码。"
      follow_up: "通过后续综合实验继续核对轴的顺序。"
    - task: "s02_t04"
      observation: "已纠正拆头漏交换轴、K 转置轴错误及 softmax 位置错误；最终代码在本地环境执行成功，输出 [2,3,8]，权重行和约为 1，手动加权和比较为 True。"
      follow_up: "核心实现验收通过；后续复习中再用口述确认注意力索引含义与 softmax 放在乘 V 前的原因。"

stages:
  - id: "s01"
    title: "Tensor、shape 与索引"
    suggested_day: "第 1 天前半段"
    status: "in_progress"
    concepts:
      - "scalar、vector、matrix、tensor；shape [] 与 [1] 的区别"
      - "轴的数量 ndim、元素总数 numel、各轴的业务含义"
      - "[B, T]、[B, T, D] 与图像 [B, C, H, W]"
      - "整数索引与切片；shape、dtype、device"
    tasks:
      - id: "s01_t01"
        status: "needs_review"
        type: "手算"
        instruction: "对于 x = torch.zeros(4, 5, 6)，计算轴数、元素总数，以及 x[2]、x[2, 1]、x[2, 1, 3] 的 shape。"
        hint: "把它想成 4 组，每组 5 行，每行 6 个数；整数索引选定一个轴。"
        acceptance: "所有结果正确，并能区分轴数与元素总数。"
      - id: "s01_t02"
        status: "completed"
        type: "手算与解释"
        instruction: "对 images.shape = [8, 1, 28, 28]，解释图片数量、单张元素数、images[0] 的 shape，以及保留批次轴展开每张图片后的 shape。"
        hint: "保留图片数量，只把每张图片内部的数字排成一行。"
        acceptance: "能解释每个轴的含义，展开后不混合不同样本。"
      - id: "s01_t03"
        status: "not_started"
        type: "实现"
        instruction: "用 PyTorch 验证前两题，打印 shape、ndim、numel、dtype、device；再比较 x[0] 与 x[0:1]。"
        hint: "整数索引与切片对轴的保留方式不同。"
        acceptance: "提交预测与输出，解释所有不一致，并区分标量和长度为 1 的向量。"
    gate: "能独立解释多维 Tensor 的各轴，正确计算索引结果与元素总数。"

  - id: "s02"
    title: "矩阵乘法、广播与 Q/K/V 的 shape"
    suggested_day: "第 1 天下半段～第 2 天"
    status: "completed"
    concepts:
      - "点积与沿共享维度求和；逐元素乘法 * 与矩阵乘法 @"
      - "[M, K] @ [K, N] 与带批次的矩阵乘法"
      - "广播、reshape、transpose、permute、unsqueeze、dim"
      - "Q = XWq、K = XWk、V = XWv；D = H × Dh"
    tasks:
      - id: "s02_t01"
        status: "needs_review"
        type: "手算与实现"
        instruction: "手算一个 [2, 3] @ [3, 2] 的全部结果，随后用 PyTorch 验证；另举一个维度不匹配的例子并解释原因。"
        hint: "一个输出元素等于左边一行和右边一列对应相乘后求和。"
        acceptance: "数值与 shape 正确，能解释求和发生在哪个轴。"
      - id: "s02_t02"
        status: "completed"
        type: "手算与实现"
        instruction: "预测 [32, 128, 4096] @ [4096, 11008] 的结果 shape；使用小尺寸验证 x @ w + b，并解释 b 的广播。"
        hint: "同一组权重作用于每条序列的每个位置。"
        acceptance: "正确得到 [32, 128, 11008]，且不会为验证而分配不必要的大 Tensor。"
      - id: "s02_t03"
        status: "completed"
        type: "实现与解释"
        instruction: "用 arange 创建可追踪元素的 Tensor，比较 reshape 与 transpose；把 [B, T, D] 拆成 [B, H, T, Dh] 再合并回去。"
        hint: "先拆出 H 和 Dh，再交换 T 与 H；不要用 reshape 代替交换轴。"
        acceptance: "合并后与原 Tensor 相同，并能说明中间元素对应关系。"
      - id: "s02_t04"
        status: "completed"
        type: "实现与解释"
        instruction: "使用 B=2、T=3、D=8、H=2，计算 Q/K/V、Q @ K.transpose(-2, -1)、缩放后的 softmax 和 weights @ V，标注全部 shape。"
        hint: "两个 T 分别对应 query 位置和 key 位置；softmax 概率原理在 s04 展开。"
        acceptance: "解释 [B, H, T, T] 与 [B, H, T, Dh]，验证每行注意力权重之和约为 1。"
    gate: "能追踪矩阵乘法和简化注意力的 shape；知道本练习不包含完整因果注意力模型。"

  - id: "s03"
    title: "梯度、计算图与反向传播"
    suggested_day: "第 3 天"
    status: "not_started"
    concepts:
      - "导数作为局部变化率、偏导数、链式法则"
      - "forward、computational graph、backward、requires_grad、grad"
      - "梯度累积；计算梯度与更新参数的区别"
    tasks:
      - id: "s03_t01"
        status: "not_started"
        type: "手算"
        instruction: "对 y=w*x+b、loss=(y-target)^2，设 x=2、w=3、b=1、target=5，计算 y、loss、loss 对 w 和 b 的偏导数。"
        hint: "先计算 loss 对 y 的导数，再乘上 y 对参数的导数。"
        acceptance: "能写出链式法则，并解释梯度符号的含义。"
      - id: "s03_t02"
        status: "not_started"
        type: "实现"
        instruction: "用 requires_grad=True 验证手算；打印 backward 前后的参数与 .grad，再在 no_grad 中手动执行一次梯度下降。"
        hint: "backward 只计算梯度；参数更新需要另一个操作。"
        acceptance: "梯度与手算一致，能定位参数在哪一步发生变化。"
      - id: "s03_t03"
        status: "not_started"
        type: "对照实验"
        instruction: "保持参数不变，两次重新前向并 backward，比较不清梯度与清梯度的结果。"
        hint: "每次重新建立前向计算图，不对已释放中间值的同一个 loss 直接再次反传。"
        acceptance: "能解释梯度累积，以及 zero_grad、backward、step 各自的职责。"
    gate: "不查资料解释 loss.backward()，能手算并验证简单计算图的梯度。"

  - id: "s04"
    title: "Softmax、交叉熵与分类训练"
    suggested_day: "第 4 天"
    status: "not_started"
    concepts:
      - "logits 与 probability；指数、自然对数的必要直觉"
      - "softmax 的归一化轴；单标签交叉熵 -log(p_target)"
      - "CrossEntropyLoss 接收 logits；类别标签使用 long 类型"
      - "语言模型的下一 token 预测、输入目标错位与有效位置"
    tasks:
      - id: "s04_t01"
        status: "not_started"
        type: "计算与实现"
        instruction: "对三个类别的 logits 计算 softmax 和指定正确类别的交叉熵，与 PyTorch 核对；比较正确类别概率为 0.9、0.5、0.1 时的损失。"
        hint: "先指数化并归一化，再取正确类别概率的负自然对数。"
        acceptance: "概率和约为 1，并能解释为什么正确类别概率越小，损失越大。"
      - id: "s04_t02"
        status: "not_started"
        type: "实现"
        instruction: "构造二维特征、两个类别的可分小数据集，实现 logits=x@W、交叉熵、backward 和 SGD 更新，打印 shape、gradient、parameter、loss。"
        hint: "使用 [B, C] logits 和 [B] 类别标签；不要先 softmax 再传给 cross_entropy。"
        acceptance: "损失整体下降，预测合理，梯度 shape 与参数一致。"
      - id: "s04_t03"
        status: "not_started"
        type: "手算与实现"
        instruction: "给一段 token 序列手工构造错位的输入与目标；用小尺寸 [B, T, V] logits 和 [B, T] 标签计算交叉熵。"
        hint: "把 B 与 T 合并成样本轴，保留 V 作为类别轴；说明 padding 位置何时需要忽略。"
        acceptance: "能解释语言模型在每个有效位置预测什么，以及为何 logits 和标签必须对齐。"
    gate: "能独立写出线性分类训练循环，并解释交叉熵的输入与含义。"

  - id: "s05"
    title: "优化器、学习率与状态内存"
    suggested_day: "第 5 天"
    status: "not_started"
    concepts:
      - "SGD 更新、Momentum 的历史方向"
      - "Adam 的一阶矩、二阶矩、偏差修正的作用"
      - "AdamW 的解耦权重衰减；学习率与 weight decay 的区别"
      - "参数、梯度与 optimizer states 的内存构成"
    tasks:
      - id: "s05_t01"
        status: "not_started"
        type: "手算与对照实验"
        instruction: "手算一次 SGD 更新；在相同初始参数和数据上比较较小、适中、较大学习率的训练变化。"
        hint: "每轮对照都重置模型和优化器，避免把初始化差异当成学习率影响。"
        acceptance: "能解释更新幅度和观测到的收敛或震荡现象，不声称 loss 每步必然下降。"
      - id: "s05_t02"
        status: "not_started"
        type: "实现与解释"
        instruction: "分别使用 SGD、带 momentum 的 SGD、Adam、AdamW，执行更新后打印 optimizer.state 的键、Tensor shape 和 dtype。"
        hint: "许多状态在首次 step 时才初始化；重点找 momentum_buffer、exp_avg、exp_avg_sq。"
        acceptance: "能把主要缓存对应到算法含义，并说明 AdamW 的衰减为何与 Adam 的自适应梯度更新分开。"
      - id: "s05_t03"
        status: "not_started"
        type: "手算"
        instruction: "估算 100 万个 FP32 参数在普通 AdamW 下的参数、梯度、一阶矩、二阶矩内存，并列出未计入项。"
        hint: "FP32 每个元素 4 字节；声明采用十进制 MB，区分估算与实际峰值。"
        acceptance: "四项估算正确，知道 activation、临时缓存和不同精度策略会改变总内存。"
    gate: "能解释各优化器的主要状态、学习率和权重衰减，而不只知道名称。"

  - id: "s06"
    title: "MNIST 与完整 MLP 训练"
    suggested_day: "第 6 天"
    status: "not_started"
    concepts:
      - "Dataset、DataLoader、batch、epoch、训练集与测试集"
      - "Flatten、Linear、ReLU、参数注册"
      - "train/eval 与 no_grad 的区别；loss 和 accuracy"
    architecture:
      dimensions: [784, 256, 128, 10]
      hidden_layers: 2
      linear_layers: 3
      hidden_activation: "ReLU"
      output: "10 类 logits，不额外添加 softmax"
    tasks:
      - id: "s06_t01"
        status: "not_started"
        type: "实现"
        instruction: "加载 MNIST，打印一个 batch 的图片与标签 shape、dtype、数值范围，并展示或检查若干样本。"
        hint: "ToTensor 后图片通常为 [B, 1, 28, 28]；首次运行需要下载数据。"
        acceptance: "能说明样本与标签的对应关系，训练集与测试集用途明确。"
      - id: "s06_t02"
        status: "not_started"
        type: "实现与手算"
        instruction: "实现指定 MLP，逐层打印 shape，并计算每个 Linear 的权重、偏置参数数量。"
        hint: "nn.Linear 的 weight 存储为 [out_features, in_features]，前向使用其转置。"
        acceptance: "参数数量与代码统计一致，能解释为何隐藏层需要非线性。"
      - id: "s06_t03"
        status: "not_started"
        type: "实现"
        instruction: "独立完成训练与评估循环，记录每轮平均训练损失和测试准确率；首个 batch 打印参数与梯度信息。"
        hint: "平均损失按样本数加权；评估同时使用 eval 和 no_grad；检查 device 一致。"
        acceptance: "训练与评估逻辑正确，损失总体下降，准确率明显高于随机猜测；约 95% 作为参考目标而非硬性保证。"
      - id: "s06_t04"
        status: "not_started"
        type: "对照实验"
        instruction: "去掉隐藏层 ReLU 做一次对照；再只用几十张训练图片反复训练，观察训练表现与独立数据表现。"
        hint: "每次对照重新初始化，记录设置；区分表达能力、记忆训练样本与泛化。"
        acceptance: "能解释实验结果与局限，不仅报告准确率。"
    gate: "能独立实现并解释完整 MLP 分类器，定位基本的 shape、标签和训练循环错误。"

  - id: "s07"
    title: "Activation、综合复写与最终验收"
    suggested_day: "第 7 天"
    status: "not_started"
    concepts:
      - "前向中间值与反向所需数据"
      - "对二维 Y=XW，已知 G=dL/dY 时，dL/dW=X转置@G"
      - "训练与推理的内存差异；checkpointing 的重算直觉"
    tasks:
      - id: "s07_t01"
        status: "not_started"
        type: "手算与解释"
        instruction: "给 X、W、Y 和上游梯度 G 标注 shape，推导或验证 dL/dW 的 shape，解释计算参数梯度为什么需要 X。"
        hint: "隐藏层的输入 X 往往就是上一层 activation；不是所有运算都保存全部中间结果。"
        acceptance: "从具体求导依赖解释 activation 保存，而非只背诵训练更耗内存。"
      - id: "s07_t02"
        status: "not_started"
        type: "独立实现"
        instruction: "不看之前代码，重写一个最小分类训练与评估循环；遇到报错先提出原因假设，再验证。"
        hint: "按数据、模型、损失、清梯度、反向、更新、评估逐项检查。"
        acceptance: "代码能运行，能够解释每一步，并自行修复至少一个实际或教师设置的错误。"
      - id: "s07_t03"
        status: "not_started"
        type: "口头或书面答辩"
        instruction: "不查资料解释 backward、矩阵乘法 shape、交叉熵输入、优化器状态、activation 保存，并完成一道新的 shape 迁移题。"
        acceptance: "关键结论正确，能结合代码或公式解释原因；薄弱项回到对应任务补练。"
    gate: "完成 final_assessment 全部要求。"

final_assessment:
  requirements:
    - "立即判断 [32, 128, 4096] @ [4096, 11008] 的结果为 [32, 128, 11008]，并解释原因。"
    - "解释 backward 如何沿计算图应用链式法则、累积梯度，以及它为何不直接更新参数。"
    - "说明 logits、softmax、交叉熵的关系，正确使用 PyTorch 交叉熵。"
    - "区分 zero_grad、backward、step，以及 eval 与 no_grad。"
    - "解释 Adam/AdamW 保存的主要状态，并做基础内存估算。"
    - "结合梯度公式解释为什么训练需要保存部分 activation。"
    - "独立完成有两个隐藏层的 MNIST MLP 训练与评估。"
  evidence: ["手算与解释", "可运行代码", "关键运行输出", "错题修正或迁移练习"]
